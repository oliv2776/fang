substitutions:
  version: "1.2.1"
  type: "gen3"
  buildinfo: "${version} [TX:${uart_tx} RX:${uart_rx}]"


logger:
improv_serial:
captive_portal:

wifi:
  ap:
    ssid: "neato-brainslug"
    password: "make-it-suck-again"

ota:
  - platform: esphome
    password: ${ota_password}

esphome:
  name: ${name}
  project: 
    name: philip2809.neato-brainslug
    version: ${buildinfo}

  comment: "${type}|${buildinfo}|${comment}"

  on_boot:
    - priority: 600
      then:
        - lambda: !lambda |-
            id(uiState).publish_state("Starting...");
        - logger.set_level: INFO

    - priority: -100
      then:
        - lambda: !lambda |-
            id(uiState).publish_state("Starting...");

            ESPTime t = ESPTime::from_epoch_local(id(g_last_cleaning_start_time));
            std::string ts = t.strftime("%Y-%m-%d %H:%M:%S");
            id(last_cleaning_time).publish_state(ts.c_str());

            if (id(g_last_cleaning_type) == 0) {
              id(last_cleaning_type).publish_state("HOUSE");
            } else if (id(g_last_cleaning_type) == 1) {
              id(last_cleaning_type).publish_state("SPOT");
            }

            id(last_cleaning_duration).publish_state(id(g_last_cleaning_duration));

            // Update nbs_time and text entity from persisted global
            if (!id(g_timezone).empty()) {
              id(nbs_time).set_timezone(id(g_timezone).c_str());
              id(timezone_text).publish_state(id(g_timezone).c_str());
              ESP_LOGI("timezone", "Restored timezone: %s", id(g_timezone).c_str());
            }

            char buf[40];
            snprintf(
              buf, sizeof(buf),
              "%u,%u,%u,%u,%u,%u,%u,%u",
              id(g_schedule)[0],
              id(g_schedule)[1],
              id(g_schedule)[2],
              id(g_schedule)[3],
              id(g_schedule)[4],
              id(g_schedule)[5],
              id(g_schedule)[6],
              id(g_schedule)[7]
            );

            id(scheduleset).publish_state(buf);


script:
  - id: get_user_settings
    mode: queued
    then:
      - delay: 100ms
      - uart.write: "GetUserSettings \n"

  - id: get_all_data
    mode: queued
    then: 
      - uart.write: "GetErr \n"  
      - delay: 50ms  
      - uart.write: "GetState \n"    
      - delay: 50ms  
      - uart.write: "GetCharger \n"    
      - delay: 50ms  
      - uart.write: "GetUserSettings \n"  
      - delay: 50ms
      - uart.write: "GetWarranty \n"
      - delay: 50ms  
      - uart.write: "TestMode \n"
      - delay: 50ms  
      - uart.write: "GetVersion \n"    
  
  - id: initial_data_get # when the robot has booted, run this initial fetch after 5 seconds of being able to send commands, the 5 sec needed to the robot can calculate battery level etc.
    mode: queued
    then: 
      - delay: 5sec
      - script.execute: get_all_data

  - id: robotShutdown
    mode: queued
    then:
      - lambda: 'id(uiState).publish_state("Shutting down...");'
      - uart.write: "TestMode On \n"
      - delay: 100ms
      - uart.write: "SetSystemMode Shutdown \n"

  - id: powercycle
    mode: queued
    then:
      - lambda: 'id(initial_ready) = false;' # I want to refetch all data in case we powercycle
      - lambda: 'id(uiState).publish_state("Shutting down...");'
      - uart.write: "TestMode On \n"
      - delay: 100ms
      - uart.write: "SetSystemMode PowerCycle \n"

  - id: cleaning_stopped
    then: 
      - lambda: !lambda |-
          uint64_t now_ts = id(nbs_time).now().timestamp;
          uint64_t start_ts = id(g_last_cleaning_start_time);

          if (start_ts > 0) {
              uint32_t duration_min = (now_ts - start_ts) / 60;
              id(g_last_cleaning_duration) = duration_min;
              id(last_cleaning_duration).publish_state(duration_min);
          }

  - id: play_extra_sounds
    parameters:
      soundid: int
    then:
      - if:
          condition:
            lambda: |-
              return id(g_play_extra_sounds);
          then:
            - uart.write: !lambda |-
                std::string s =
                  "PlaySound SoundId " + std::to_string(soundid) + "\n";
                return std::vector<uint8_t>(s.begin(), s.end());

  - id: send_event
    parameters:
      event: string
    then:
      - uart.write: !lambda |-
          std::string s =
            "SetEvent event " + event + " SKey " + id(robot_skey) + "\n";
          return std::vector<uint8_t>(s.begin(), s.end());


globals:
  - id: initial_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: robot_skey
    type: std::string
    restore_value: no

  # --- Restore Value ---
  - id: g_last_cleaning_start_time
    type: uint64_t
    restore_value: yes

  - id: g_last_cleaning_type
    type: uint32_t
    restore_value: yes

  - id: g_last_cleaning_duration
    type: uint32_t
    restore_value: yes

  - id: g_play_extra_sounds
    type: bool
    restore_value: yes

  - id: g_schedule
    type: uint8_t[8]
    restore_value: yes
    initial_value: '{0,0,0,0,0,0,0,0}'

  - id: g_timezone
    type: std::string
    restore_value: yes
    initial_value: ''


interval:
  - interval: ${infointerval}
    then:
      - uart.write: "GetErr \n"
      - uart.write: "GetState \n"
  - interval: ${chargerinterval}
    then: 
      - uart.write: "GetCharger \n"


uart:
  id: uart_bus
  baud_rate: 115200
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  rx_buffer_size: 2048
  debug:
    dummy_receiver: true
    direction: RX
    after:
      bytes: 0
      # Ligne par ligne (au lieu d'attendre le \x1A de fin de reponse en une
      # seule fois) : evite le crash documente dans
      # research/command-experiments.md quand la reponse est volumineuse
      # (GetLDSScan ~360 lignes). Voir le commentaire au debut de la lambda
      # ci-dessous pour l'accumulation manuelle des lignes d'une meme reponse.
      delimiter: "\n"
    sequence:
      - lambda: !lambda |-
          UARTDebug::log_string(direction, bytes);

          // ---- TRIM FUNCTION ----
          auto trim = [](std::string &s) {
            // trim leading
            s.erase(s.begin(), std::find_if(s.begin(), s.end(),
                [](unsigned char ch){ return !std::isspace(ch); }));
            // trim trailing
            s.erase(std::find_if(s.rbegin(), s.rend(),
                [](unsigned char ch){ return !std::isspace(ch); }).base(), s.end());
          };

          // --- HEX DECODER ---
          auto hex_to_uint32 = [](const std::string &hex) -> uint32_t {
              return static_cast<uint32_t>(strtoul(hex.c_str(), nullptr, 16));
          };

          // ---- ACCUMULATION LIGNE PAR LIGNE D'UNE REPONSE COMPLETE ----
          // Le trigger se declenche maintenant a chaque "\n" recu (voir
          // "after:" ci-dessus) au lieu d'attendre le \x1A de fin de
          // reponse d'un coup : necessaire pour GetLDSScan (~360 lignes)
          // qui plantait l'ESP en mode "buffer complet" (cf
          // research/command-experiments.md). On reconstitue donc la
          // reponse complete nous-memes dans un buffer statique entre
          // deux appels de cette lambda.
          //
          // Le robot termine une reponse complete par un octet \x1A
          // colle a la fin de la derniere ligne de contenu (pas de \r\n
          // avant), donc il n'arrive PAS via son propre trigger "\n" :
          // il est livre au debut du PROCHAIN chunk de ligne recu (celui
          // de la prochaine commande). On le detecte donc en tete de
          // chunk, pas en fin.
          static std::vector<std::string> line_buf;

          std::string chunk(bytes.begin(), bytes.end());

          // Un \x1A en tete de ce chunk = fin de la reponse precedente.
          // On finalise cette reponse-la AVANT de traiter le reste du
          // chunk courant (qui, lui, appartient a la reponse suivante).
          size_t ctrl_z_pos = chunk.find('\x1A');
          std::string remainder;
          bool have_terminator = (ctrl_z_pos != std::string::npos);
          if (have_terminator) {
            remainder = chunk.substr(ctrl_z_pos + 1);
            chunk = chunk.substr(0, ctrl_z_pos);
          }

          trim(chunk);
          if (!chunk.empty()) line_buf.push_back(chunk);

          if (!have_terminator) {
            // Reponse pas encore terminee, on attend la suite.
            return;
          }

          // ---- REPONSE COMPLETE : on dispatch sur les lignes accumulees ----
          std::vector<std::string> lines = line_buf;
          line_buf.clear();

          // S'il restait du texte apres le \x1A (deja le debut de la
          // prochaine reponse), on ne le perd pas : on le remet en attente.
          trim(remainder);
          if (!remainder.empty()) line_buf.push_back(remainder);

          if (lines.empty()) return;

          // ---- DETECT WHICH COMMAND WAS USED ----
          std::string command = lines[0];  // first line (GetErr, GetState, etc.)


          ESP_LOGI("uart_parser", "COMMAND: %s", command.c_str());
          // ---- OPTIONAL: print each line for debugging ----
          for (auto &line : lines) {
            std::vector<uint8_t> v(line.begin(), line.end());
            UARTDebug::log_string(direction, v);
            //ESP_LOGI("uart_parser", "LINE: %s", line.c_str());
          }



          // ---- SPECIAL PARSING FOR GetErr ----
          if (command == "GetErr") {
            // A GetErr response looks like for gen3:
            // 0: GetErr
            // 1: Error
            // 2: <error1>
            // 3: Alert
            // 4: <error2>
            // 5: USB state
            // 6: NOT connected

            if (lines.size() < 7) return;
            if (lines[1] != "Error" || lines[3] != "Alert") return;

            id(robotError).publish_state(lines[2].c_str());
            id(robotAlert).publish_state(lines[4].c_str());
            id(usbConnected).publish_state(lines[6].find("NOT connected") == std::string::npos);

            // If we can get erros/alerts, the system is ready for other commands:
            if (!id(initial_ready)) {
                id(initial_ready) = true;
                id(initial_data_get).execute();
            }
          }

          else if (command == "GetCharger") {
            // Format after the header:
            // Label,Value
            // FuelPercent,53
            // BatteryOverTemp,0
            // ...

            for (size_t i = 2; i < lines.size(); i++) {
              std::string &line = lines[i];

              size_t comma = line.find(',');
              if (comma == std::string::npos) continue;

              std::string key = line.substr(0, comma);
              std::string value = line.substr(comma + 1);

              // Trim them:
              trim(key);
              trim(value);

              // ---- MATCH KEYS AND PUBLISH ----
                   if (key == "FuelPercent") id(chargerFuelPercent).publish_state(atof(value.c_str()));
              else if (key == "BatteryOverTemp") id(chargerBatteryOverTemp).publish_state(value == "1");
              else if (key == "ChargingActive") id(chargerChargingActive).publish_state(value == "1");
              else if (key == "ChargingEnabled") id(chargerChargingEnabled).publish_state(value == "1");
              else if (key == "ConfidentOnFuel") id(chargerConfidentOnFuel).publish_state(value == "1");
              else if (key == "OnReservedFuel") id(chargerOnReservedFuel).publish_state(value == "1");
              else if (key == "EmptyFuel") id(chargerEmptyFuel).publish_state(value == "1");
              else if (key == "BatteryFailure") id(chargerBatteryFailure).publish_state(value == "1");
              else if (key == "ExtPwrPresent") id(chargerExtPwrPresent).publish_state(value == "1");
              else if (key == "ThermistorPresent") id(chargerThermistorPresent).publish_state(value == "1");
              else if (key == "BattTempCAvg") id(chargerBattTempCAvg).publish_state(atof(value.c_str()));
              else if (key == "VBattV") id(chargerVBattV).publish_state(atof(value.c_str()));
              else if (key == "VExtV") id(chargerVExtV).publish_state(atof(value.c_str()));
              else if (key == "Charger_mAH") id(chargerCharger_mAH).publish_state(atof(value.c_str()));
              else if (key == "Discharge_mAH") id(chargerDischarge_mAH).publish_state(atof(value.c_str()));
            }
          }

          // ---- SLAM: GetMotor -> publie l'odometrie (roues) en MQTT ----
          // Format confirme sur ce robot (voir research/command-experiments.md) :
          //   GetMotor
          //   Parameter,Value
          //   Brush_RPM,0
          //   ...
          //   LeftWheel_PositionInMM,-365
          //   ...
          //   RightWheel_PositionInMM,-365
          //   ...
          // Note : la commande reelle est bien "GetMotor" (singulier), pas
          // "GetMotors" comme liste dans la doc officielle Neato.
          else if (command == "GetMotor") {
            bool have_left = false, have_right = false;
            double left_mm = 0.0, right_mm = 0.0;

            for (size_t i = 2; i < lines.size(); i++) {
              std::string &line = lines[i];

              size_t comma = line.find(',');
              if (comma == std::string::npos) continue;

              std::string key = line.substr(0, comma);
              std::string value = line.substr(comma + 1);

              trim(key);
              trim(value);

              if (key == "LeftWheel_PositionInMM") {
                left_mm = atof(value.c_str());
                have_left = true;
              } else if (key == "RightWheel_PositionInMM") {
                right_mm = atof(value.c_str());
                have_right = true;
              }
            }

            // On ne publie que si on a bien recupere les deux valeurs,
            // sinon slam_bridge.py risque de recevoir un delta faux (une
            // seule roue mise a jour par rapport au message precedent).
            if (have_left && have_right) {
              // Horloge relative (secondes depuis le boot de l'ESP) : le
              // bridge SLAM ne calcule que des deltas de temps entre deux
              // messages, donc pas besoin d'une horloge absolue (NTP/HA).
              double ts = millis() / 1000.0;

              char payload[128];
              int len = snprintf(
                  payload, sizeof(payload),
                  "{\"left_mm\":%.2f,\"right_mm\":%.2f,\"timestamp\":%.3f}",
                  left_mm, right_mm, ts
              );

              if (len > 0 && len < (int) sizeof(payload)) {
                // "neato_mqtt" est l'id du composant mqtt: defini dans
                // config/comp/slam-odom.yaml (a inclure dans local.yaml).
                id(neato_mqtt).publish(
                    "${mqtt_wheels_topic}",
                    std::string(payload, len),
                    0,     // QoS 0 : donnees frequentes, pas critique d'en perdre une
                    false  // retain = false
                );
              }
            }
          }

          // ---- SECURITE : GetDigitalSensors -> chocs + roue soulevee ----
          // Format confirme sur ce robot (research/command-experiments.md) :
          //   GetDigitalSensors
          //   Digital Sensor Name, Value
          //   SNSR_DC_JACK_IS_IN,0
          //   SNSR_DUSTBIN_IS_IN,1
          //   SNSR_LEFT_WHEEL_EXTENDED,0   <- roue soulevee = bord/vide en dessous
          //   SNSR_RIGHT_WHEEL_EXTENDED,0
          //   LSIDEBIT,0                    <- chocs (pare-chocs) : 1 = touche
          //   LFRONTBIT,0
          //   LLDSBIT,0
          //   RSIDEBIT,0
          //   RFRONTBIT,0
          //   RLDSBIT,0
          else if (command == "GetDigitalSensors") {
            bool bump = false;
            bool wheel_extended = false;

            for (size_t i = 2; i < lines.size(); i++) {
              std::string &line = lines[i];
              size_t comma = line.find(',');
              if (comma == std::string::npos) continue;

              std::string key = line.substr(0, comma);
              std::string value = line.substr(comma + 1);
              trim(key);
              trim(value);
              bool is_set = (value == "1");

              if (key == "SNSR_LEFT_WHEEL_EXTENDED" || key == "SNSR_RIGHT_WHEEL_EXTENDED") {
                if (is_set) wheel_extended = true;
              } else if (key == "LSIDEBIT" || key == "LFRONTBIT" ||
                         key == "RSIDEBIT" || key == "RFRONTBIT") {
                if (is_set) bump = true;
              }
              // LLDSBIT/RLDSBIT : chocs sur le mat LiDAR, pas geres ici pour
              // l'instant (pas critique pour l'arret d'urgence roues/chute).
            }

            id(g_safety_bump) = bump;
            id(g_safety_wheel_extended) = wheel_extended;

            if (bump || wheel_extended) {
              // ARRET IMMEDIAT, sans attendre le prochain tour du round-robin.
              id(uart_bus).write_str("SetMotor LWheelDisable RWheelDisable \n");
              id(g_safety_stop) = true;
            }
          }

          // ---- SECURITE : GetAnalogSensors -> detection de vide (chute) ----
          // Format confirme sur ce robot (research/command-experiments.md) :
          //   GetAnalogSensors
          //   SensorName,Unit,Value
          //   ...
          //   DropSensorLeft,mm,19,
          //   DropSensorRight,mm,19,
          //
          // SEUIL NON CALIBRE : la valeur "19" ci-dessus vient d'un robot
          // pose sur un sol normal. Je n'ai aucune capture de la valeur
          // lue au-dessus d'un vide (escalier). Le seuil ci-dessous est
          // maintenant une valeur CALIBRABLE A CHAUD (id g_cal_drop_threshold_mm,
          // definie dans slam-odom.yaml, persistee en flash) plutot qu'une
          // constante figee - voir slam/calibrate.py pour la mesurer
          // proprement (sol normal vs au-dessus du vide) sans avoir a
          // reflasher a chaque essai.
          else if (command == "GetAnalogSensors") {
            bool cliff = false;
            int drop_left_mm = -1;
            int drop_right_mm = -1;

            for (size_t i = 2; i < lines.size(); i++) {
              std::string &line = lines[i];
              // Format "Name,Unit,Value," (3 colonnes + virgule finale)
              size_t c1 = line.find(',');
              if (c1 == std::string::npos) continue;
              size_t c2 = line.find(',', c1 + 1);
              if (c2 == std::string::npos) continue;
              size_t c3 = line.find(',', c2 + 1);

              std::string key = line.substr(0, c1);
              std::string value_str = (c3 == std::string::npos)
                  ? line.substr(c2 + 1)
                  : line.substr(c2 + 1, c3 - c2 - 1);
              trim(key);
              trim(value_str);

              if (key == "DropSensorLeft" || key == "DropSensorRight") {
                int value = atoi(value_str.c_str());
                if (key == "DropSensorLeft") drop_left_mm = value;
                else drop_right_mm = value;
                if (value > id(g_cal_drop_threshold_mm)) cliff = true;
              }
            }

            id(g_safety_cliff) = cliff;

            if (cliff) {
              id(uart_bus).write_str("SetMotor LWheelDisable RWheelDisable \n");
              id(g_safety_stop) = true;
            }

            // Publication MQTT du statut de securite complet (3 flags +
            // valeurs BRUTES des capteurs de vide, necessaires pour
            // calibrer g_cal_drop_threshold_mm depuis slam/calibrate.py -
            // sans elles, impossible de savoir quelle valeur mettre).
            char safety_payload[220];
            int slen = snprintf(
                safety_payload, sizeof(safety_payload),
                "{\"bump\":%s,\"cliff\":%s,\"wheel_extended\":%s,\"stop\":%s,"
                "\"drop_left_mm\":%d,\"drop_right_mm\":%d,\"drop_threshold_mm\":%.1f,"
                "\"timestamp\":%.3f}",
                id(g_safety_bump) ? "true" : "false",
                id(g_safety_cliff) ? "true" : "false",
                id(g_safety_wheel_extended) ? "true" : "false",
                id(g_safety_stop) ? "true" : "false",
                drop_left_mm, drop_right_mm, id(g_cal_drop_threshold_mm),
                millis() / 1000.0
            );
            if (slen > 0 && slen < (int) sizeof(safety_payload)) {
              id(neato_mqtt).publish(
                  "${mqtt_safety_topic}",
                  std::string(safety_payload, slen),
                  1,     // QoS 1 : c'est de la securite, on veut que ca arrive
                  false
              );
            }
          }

          // ---- SLAM: GetLDSScan -> publie le scan LiDAR en MQTT (JSON) ----
          // IMPORTANT - non verifie sur un vrai robot :
          // Contrairement a GetMotor (capture reelle disponible dans
          // research/command-experiments.md), je n'ai trouve aucune capture
          // reelle de "GetLDSScan" dans ce repo. Le parsing ci-dessous
          // suppose le format habituellement documente pour cette commande
          // sur le port debug Neato (PAS le format binaire brut du capteur
          // LDS lui-meme, qui necessiterait un second fil direct sur le
          // module - confirme absent ici, un seul fil vers le port debug) :
          //
          //   GetLDSScan
          //   AngleInDegrees,DistInMM,Intensity,ErrorCode
          //   0,543,84,0
          //   1,542,87,0
          //   ...
          //   359,540,90,0
          //   ROTATION_SPEED,300
          //
          // A VALIDER : flashe, lance "GetLDSScan" en TestMode, et compare
          // les logs uart_debug reels a ce format avant de faire confiance
          // aux donnees publiees. Si l'ordre des colonnes differe, ajuste
          // l'indice ci-dessous (angle_deg = colonne 0, dist_mm = colonne 1).
          else if (command == "GetLDSScan") {
            // 360 mesures max (une par degre). inf = pas de retour valide.
            static float ranges_m[360];
            static bool got_point[360];
            for (int i = 0; i < 360; i++) { ranges_m[i] = INFINITY; got_point[i] = false; }

            for (size_t i = 1; i < lines.size(); i++) {
              std::string &line = lines[i];
              if (line.empty()) continue;
              // On ignore la ligne d'entete (non numerique) et le footer
              // ROTATION_SPEED (pas une mesure d'angle).
              if (!std::isdigit(static_cast<unsigned char>(line[0]))) continue;

              // Split manuel sur ','
              size_t p1 = line.find(',');
              if (p1 == std::string::npos) continue;
              size_t p2 = line.find(',', p1 + 1);
              std::string angle_str = line.substr(0, p1);
              std::string dist_str = (p2 == std::string::npos)
                  ? line.substr(p1 + 1)
                  : line.substr(p1 + 1, p2 - p1 - 1);

              int angle_deg = atoi(angle_str.c_str());
              int dist_mm = atoi(dist_str.c_str());

              if (angle_deg < 0 || angle_deg >= 360) continue;
              if (dist_mm <= 0) continue;  // 0 = pas de retour valide

              ranges_m[angle_deg] = dist_mm / 1000.0f;
              got_point[angle_deg] = true;
            }

            // ---- Construction du JSON ----
            // Taille max : "inf," ou "8.123," * 360 + accolades ~ 3.5KB,
            // largement sous la limite MQTT par defaut (256KB).
            static char json_buf[4096];
            size_t pos = 0;
            pos += snprintf(json_buf + pos, sizeof(json_buf) - pos, "{\"ranges\":[");
            for (int i = 0; i < 360 && pos < sizeof(json_buf) - 16; i++) {
              if (got_point[i]) {
                pos += snprintf(json_buf + pos, sizeof(json_buf) - pos, "%.3f", ranges_m[i]);
              } else {
                pos += snprintf(json_buf + pos, sizeof(json_buf) - pos, "null");
              }
              if (i < 359) pos += snprintf(json_buf + pos, sizeof(json_buf) - pos, ",");
            }
            pos += snprintf(json_buf + pos, sizeof(json_buf) - pos,
                             "],\"angle_min\":0.0,\"angle_max\":6.2657,"
                             "\"angle_increment\":0.017453,\"timestamp\":%.3f}",
                             millis() / 1000.0);

            if (pos > 0 && pos < sizeof(json_buf)) {
              id(neato_mqtt).publish(
                  "${mqtt_scan_topic}",
                  std::string(json_buf, pos),
                  0,
                  false
              );
            }
          }

          else if (command == "GetWarranty") {
              // Format after the header:
              // Item,Value
              // CumulativeCleaningTimeInSecs,001ce34f
              // CumulativeBatteryCycles,01f7
              // ValidationCode,15648b6e

              for (size_t i = 2; i < lines.size(); i++) {
                  std::string &line = lines[i];
                  size_t comma = line.find(',');
                  if (comma == std::string::npos) continue;

                  std::string key = line.substr(0, comma);
                  std::string value = line.substr(comma + 1);

                  // Trim whitespace
                  trim(key);
                  trim(value);
                  
                  if (key == "CumulativeBatteryCycles") {
                      uint32_t cycles = hex_to_uint32(value);
                      id(batteryCycles).publish_state(cycles);
                  }
              }
          }

          else if (command == "GetVersion") {
            for (auto &line : lines) {
              size_t comma = line.find(',');
              if (comma == std::string::npos) continue;

              std::string key = line.substr(0, comma);
              std::string value = line.substr(comma + 1);
              trim(key);
              trim(value);

                   if (key == "Serial Number") id(robotSerial).publish_state(value.c_str());
              else if (key == "Model") id(robotModel).publish_state(value.c_str());
              else if (key == "Software") id(robotSoftware).publish_state(value.c_str());
            }
          }
          else if (command == "TestMode") {
            if (lines[1].find(": On") != std::string::npos) id(testMode).publish_state(true);
            else if (lines[1].find(": Off") != std::string::npos) id(testMode).publish_state(false);
          } 
          
          else if (command == "GetState") {
              std::string &states_line = lines[1];  // "Current UI State is: ...\nCurrent Robot State is: ...\n\x1A"

              size_t sep = states_line.find('\n');
              if (sep == std::string::npos) return;  // safety

              std::string ui_line = states_line.substr(0, sep);
              std::string robot_line = states_line.substr(sep + 1);

              static const char* prefix_ui = "Current UI State is: ";
              static const char* prefix_robot = "Current Robot State is: ";

              // Extract UI state
              if (ui_line.find(prefix_ui) == 0) {
                  std::string ui_state = ui_line.substr(strlen(prefix_ui));
                  trim(ui_state);
                  std::string old_state = id(uiState).state;

                  bool old_spot = (old_state == "UIMGR_STATE_SPOTCLEANINGPAUSED" ||
                                  old_state == "UIMGR_STATE_SPOTCLEANINGRUNNING");

                  bool new_spot = (ui_state == "UIMGR_STATE_SPOTCLEANINGPAUSED" ||
                                  ui_state == "UIMGR_STATE_SPOTCLEANINGRUNNING");

                  bool old_house = (old_state == "UIMGR_STATE_HOUSECLEANINGPAUSED" ||
                                    old_state == "UIMGR_STATE_HOUSECLEANINGRUNNING");

                  bool new_house = (ui_state == "UIMGR_STATE_HOUSECLEANINGPAUSED" ||
                                    ui_state == "UIMGR_STATE_HOUSECLEANINGRUNNING");
                  // Cleaning started
                  if (!old_spot && new_spot) {
                      // Mark start time
                      id(g_last_cleaning_start_time) = id(nbs_time).now().timestamp;
                      id(g_last_cleaning_type) = 1;  // SPOT = 1

                      id(last_cleaning_time).publish_state(id(nbs_time).now().strftime("%Y-%m-%d %H:%M:%S"));
                      id(last_cleaning_type).publish_state("SPOT");
                  } else if (!old_house && new_house) {
                      id(g_last_cleaning_start_time) = id(nbs_time).now().timestamp;
                      id(g_last_cleaning_type) = 0;  // HOUSE = 0

                      id(last_cleaning_time).publish_state(id(nbs_time).now().strftime("%Y-%m-%d %H:%M:%S"));
                      id(last_cleaning_type).publish_state("HOUSE");
                  } else {
                      // Cleaning stopped
                      bool old_cleaning = old_spot || old_house;
                      bool new_cleaning = new_spot || new_house;

                      if (old_cleaning && !new_cleaning) id(cleaning_stopped).execute();
                  }

                  id(uiState).publish_state(ui_state.c_str());
              }

              // Extract Robot state
              if (robot_line.find(prefix_robot) == 0) {
                  std::string robot_state = robot_line.substr(strlen(prefix_robot));
                  
                  // Remove trailing \x1A if present
                  size_t ctrl_z = robot_state.find('\x1A');
                  if (ctrl_z != std::string::npos) {
                      robot_state.erase(ctrl_z);
                  }

                  trim(robot_state);
                  
                  id(robotState).publish_state(robot_state.c_str());
              }
          }


          else if (command == "GetUserSettings") {
            for (auto &line : lines) {
              trim(line);

              // Skip lines that start with binary/invalid chars
              if (!line.empty() && static_cast<unsigned char>(line[0]) >= 0x80) continue;

              // ---- Key,Value lines ----
              size_t comma = line.find(',');
              if (comma != std::string::npos) {
                std::string key = line.substr(0, comma);
                std::string value = line.substr(comma + 1);
                trim(key);
                trim(value);

                     if (key == "ClickSounds") id(clickSounds).publish_state(value == "ON");
                else if (key == "LED") id(led).publish_state(value == "ON");
                else if (key == "Wall Enable") id(wallEnable).publish_state(value == "ON");
                else if (key == "Eco Mode") id(ecoMode).publish_state(value == "ON");
                else if (key == "IntenseClean") id(intenseClean).publish_state(value == "ON");
                else if (key == "WiFi") id(wifiOnOff).publish_state(value == "ON");
                else if (key == "Melody Sounds") id(melodySounds).publish_state(value == "ON");
                else if (key == "Warning Sounds") id(warningSounds).publish_state(value == "ON");
                else if (key == "Bin Full Detect") id(binFullDetect).publish_state(value == "ON");
                else if (key == "Filter Change Time (seconds)") id(filterChangeTime).publish_state(atof(value.c_str()));
                else if (key == "Brush Change Time (seconds)") id(brushChangeTime).publish_state(atof(value.c_str()));
                else if (key == "Dirt Bin Alert Reminder Interval (minutes)") id(dirtBinAlertReminder).publish_state(atof(value.c_str()));
              } 
              // ---- Special lines without commas ----
              else if (line.find("Current Dirt Bin Runtime is:") == 0) {
                std::string val = line.substr(strlen("Current Dirt Bin Runtime is:"));
                trim(val);
                id(currentDirtBinRuntime).publish_state(atof(val.c_str()));
              } 
              else if (line.find("Number of Cleanings where Dust Bin was Full is:") == 0) {
                std::string val = line.substr(strlen("Number of Cleanings where Dust Bin was Full is:"));
                trim(val);
                id(numberDustBinFull).publish_state(atof(val.c_str()));
              } 
            }
          } else if (command.find("ARCHES Board") != std::string::npos) id(uiState).publish_state("Starting...");


time:
  - platform: ${time_platform}
    id: nbs_time
    on_time:
      - minutes: /10
        seconds: 0
        then:
          - lambda: !lambda |-
              auto now = id(nbs_time).now();
              if (!now.is_valid()) return;

              uint8_t flags = id(g_schedule)[0];

              // bit 0 = global enable
              if (!(flags & 0x01)) {
                ESP_LOGD("schedule", "Global disabled");
                return;
              }

              // day_of_week: Sunday=1 ... Saturday=7
              uint8_t dow = now.day_of_week;

              // bit for day enable: bit1 = Sunday, bit2 = Monday, ...
              uint8_t day_bit = 1 << dow;
              if (!(flags & day_bit)) {
                ESP_LOGD("schedule", "Day %d disabled", dow);
                return;
              }

              // schedule value for today
              uint8_t value = id(g_schedule)[dow];

              // convert value → hour/min
              uint8_t target_hour = value / 6;
              uint8_t target_min  = (value % 6) * 10;

              ESP_LOGD("schedule",
                "Now %02d:%02d | Target %02d:%02d (value=%d)",
                now.hour, now.minute,
                target_hour, target_min,
                value
              );

              // check match
              if (now.hour == target_hour && now.minute == target_min) {
                ESP_LOGD("schedule", "Schedule matched → DO ACTION");
                id(houseClean).press();
              }


text:
  - platform: template
    id: scheduleset
    name: "ScheduleSet"
    mode: TEXT
    set_action:
      lambda: !lambda |-
        int i = 0;
        char *p = strtok((char *)x.c_str(), ",");

        while (p && i < 8) {
          int v = atoi(p);

          if (i == 0) {          // flags
            if (v < 0) v = 0;
            if (v > 255) v = 255;
          } else {               // day values
            if (v < 0) v = 0;
            if (v > 143) v = 143;
          }

          id(g_schedule)[i++] = (uint8_t)v;
          p = strtok(nullptr, ",");
        }

        if (i != 8) {
          ESP_LOGW("schedule", "Invalid schedule string");
        }

        char buf[40];
        snprintf(
          buf, sizeof(buf),
          "%u,%u,%u,%u,%u,%u,%u,%u",
          id(g_schedule)[0],
          id(g_schedule)[1],
          id(g_schedule)[2],
          id(g_schedule)[3],
          id(g_schedule)[4],
          id(g_schedule)[5],
          id(g_schedule)[6],
          id(g_schedule)[7]
        );

        id(scheduleset).publish_state(buf);

  - platform: template
    id: timezone_text
    name: "Timezone"
    mode: TEXT
    set_action:
      lambda: !lambda |-
        id(timezone_text).publish_state(x.c_str()); // update this text component
        id(g_timezone) = std::string(x.c_str()); // store tz in global
        id(nbs_time).set_timezone(x.c_str()); // set timezone for time
        ESP_LOGI("timezone", "Timezone set to: %s", x.c_str()); // log


