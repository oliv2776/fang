# config/comp/slam-odom.yaml
#
# À inclure dans config/local.yaml (section "packages:") pour activer
# la publication MQTT de l'odométrie ET du scan LiDAR consommées par
# slam_bridge.py côté conteneur Docker.
#
#   packages:
#     ...
#     - !include comp/slam-odom.yaml
#
# Le parsing des réponses "GetMotor" et "GetLDSScan" elles-mêmes (extraction
# des champs, construction du JSON, appel MQTT publish) est fait directement
# dans config/comp/gen3.yaml, dans le même parseur UART que GetCharger/
# GetState/etc. Ce fichier ajoute :
#   1. Le composant mqtt: (broker) nécessaire au publish
#   2. Le polling en ALTERNANCE de "GetMotor" et "GetLDSScan"
#
# HARDWARE CONFIRMÉ : un seul fil vers l'ESP32 (le port debug principal,
# cf install-esp-device-gen3.md), pas de second fil dédié au module LDS.
# En conséquence :
#   - fang-custom/neato_lidar_stream.yaml (qui suppose un second uart
#     "neato_uart" séparé, câblé directement sur le capteur) NE S'APPLIQUE
#     PAS ici et ne doit pas être inclus - ni son composant custom C++
#     fang-custom/components/neato_lidar/, qui de toute façon suppose un
#     format binaire (paquets XV-11 22 octets) différent du JSON produit
#     ici par le parsing texte de GetLDSScan.
#   - GetMotor et GetLDSScan doivent se PARTAGER le même bus UART : on ne
#     peut pas les envoyer en même temps sans corrompre les deux réponses.
#     Le script ci-dessous les envoie donc en STRICTE ALTERNANCE (jamais
#     les deux en même temps), pas en parallèle.
#
# DÉBIT ATTENDU - à mesurer sur ton robot, pas garanti :
# GetLDSScan renvoie ~360 lignes texte (~5-7 Ko) à 115200 bauds : le
# temps de transmission + parsing prend probablement plusieurs centaines
# de ms à lui seul. Avec l'alternance stricte, attends-toi à un scan et
# une odométrie environ toutes les 1-2 secondes, pas du 10Hz. C'est une
# limite physique du montage à un seul fil : garde le robot lent pendant
# le mapping pour limiter la dérive d'odométrie entre deux échantillons.
# Si ça se révèle trop lent en pratique, la vraie solution est un second
# fil câblé directement sur le module LDS (cf packet XV-11 natif, bien
# plus rapide) plutôt que de pousser cette approche plus loin.

substitutions:
  # Doivent correspondre à MQTT_BROKER / MQTT_PORT / MQTT_PREFIX dans
  # slam/.env (côté conteneur Docker).
  mqtt_broker: "192.168.10.126"
  mqtt_port: "1883"
  mqtt_wheels_topic: "neato/robot/wheels"
  mqtt_scan_topic: "neato/robot/scan"

  # Intervalle entre CHAQUE envoi (GetMotor puis GetLDSScan en alternance,
  # donc un cycle complet des deux = 2x cette valeur). À ajuster à la
  # hausse si les logs montrent des réponses tronquées/qui se chevauchent.
  slam_poll_interval: 800ms

mqtt:
  - id: neato_mqtt
    broker: ${mqtt_broker}
    port: ${mqtt_port}
    # Décommenter et utiliser !secret si ton broker demande une auth :
    # username: !secret mqtt_username
    # password: !secret mqtt_password
    discovery: false  # on ne veut pas polluer Home Assistant avec ce broker

globals:
  - id: g_slam_poll_toggle
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  # mode: single -> si un cycle précédent n'est pas terminé (ne devrait pas
  # arriver avec un slam_poll_interval assez large), on saute ce tour au
  # lieu d'empiler des commandes et de vraiment corrompre l'UART.
  - id: slam_poll_cycle
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(g_slam_poll_toggle);'
          then:
            - uart.write: "GetLDSScan \n"
          else:
            - uart.write: "GetMotor \n"
      - lambda: 'id(g_slam_poll_toggle) = !id(g_slam_poll_toggle);'

interval:
  - interval: ${slam_poll_interval}
    then:
      - script.execute: slam_poll_cycle
