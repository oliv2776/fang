# config/comp/slam-odom.yaml
#
# À inclure dans config/local.yaml (section "packages:").
#
# RECONSTRUIT DE ZÉRO à partir du gen3.yaml ORIGINAL non modifié (voir
# config/comp/gen3.yaml) après plusieurs heures de débogage où des
# ajouts précédents (réaffirmation TestMode, sécurité auto-disable,
# buffer élargi, délimiteur ligne-par-ligne...) ont fini par empêcher le
# robot de se déplacer, malgré des tests isolés qui semblaient chacun
# corrects. Reflasher l'original PUR (sans aucun fichier de ce projet)
# fait toujours bouger le robot normalement - c'est la référence.
#
# Principes pour cette reconstruction :
#   - AUCUNE réaffirmation périodique de TestMode/SetLDSRotation (coupe
#     le nettoyage natif en cours - confirmé).
#   - AUCUNE écriture UART automatique déclenchée par la sécurité
#     (bump/cliff/wheel_extended) - juste des flags exposés en MQTT,
#     observables mais non-actionnants pour l'instant. Une vraie
#     sécurité active pourra revenir plus tard, mais synchronisée
#     correctement et testée isolément d'abord.
#   - rx_buffer_size et délimiteur UART : INTOUCHÉS dans gen3.yaml
#     (2048, \x1A) - exactement comme l'original.
#   - Le round-robin ci-dessous ne couvre QUE les ajouts SLAM
#     (GetDigitalSensors/GetAnalogSensors/SetMotor/GetMotor/GetLDSScan) -
#     GetErr/GetState/GetCharger restent gérés par le bloc "interval:"
#     de l'original dans gen3.yaml, non touché.

substitutions:
  mqtt_broker: "192.168.10.108"
  mqtt_port: "1883"
  mqtt_username: ""
  mqtt_password: ""
  mqtt_wheels_topic: "neato/robot/wheels"
  mqtt_scan_topic: "neato/robot/scan"
  mqtt_safety_topic: "neato/robot/safety"
  mqtt_cmd_vel_topic: "neato/robot/cmd_vel_out"
  mqtt_clean_cmd_topic: "neato/robot/clean_cmd"

  # Intervalle entre CHAQUE vérification "réponse précédente terminée,
  # prêt pour le pas suivant" - PAS le temps d'attente d'une réponse
  # elle-même. 500ms (valeur d'origine) ajoutait jusqu'à ~500ms de temps
  # mort par pas (le code ne vérifie l'état qu'à chaque tick de cet
  # intervalle, pas immédiatement dès qu'une réponse se termine) - sur
  # un cycle de 15 pas, ça peut représenter plusieurs secondes de pur
  # temps d'attente, indépendant de la vitesse réelle du robot. 50ms
  # réduit ce temps mort d'un facteur 10 sans rien changer d'autre.
  slam_poll_interval: 50ms

  # Si aucun cmd_vel_out frais depuis plus longtemps que ça, arrêt auto.
  cmd_vel_stale_timeout: "2500"

  setmotor_lookahead_s: "5.0"
  wheel_base_m_default: "0.248"
  drop_threshold_mm_default: "60"
  setmotor_max_speed: "80"

mqtt:
  id: neato_mqtt
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_username}
  password: ${mqtt_password}
  discovery: false

globals:
  # --- Round-robin ---
  - id: g_slam_poll_step
    type: int
    restore_value: false
    initial_value: '0'

  # true = le round-robin automatique n'envoie plus rien, seul le
  # contenu de g_pending_cmd (injection manuelle) part encore.
  #
  # restore_value: true - l'ESP32 est alimenté DEPUIS le port debug du
  # robot, donc éteindre/rallumer le robot éteint ET rallume aussi
  # l'ESP32 : impossible de couper le robot seul en gardant l'ESP32
  # actif. En persistant l'état, un pause_polling envoyé avant coupure
  # reste actif après redémarrage des deux.
  - id: g_slam_poll_paused
    type: bool
    restore_value: true
    initial_value: 'false'

  # --- Synchronisation requête/réponse ---
  - id: g_awaiting_response
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_awaiting_response_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- cmd_vel (Nav2 -> MQTT -> SetMotor) ---
  - id: g_cmd_linear_x
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_cmd_angular_z
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_cmd_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Sécurité (flags exposés en MQTT uniquement, non-actionnants) ---
  - id: g_safety_bump
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_safety_cliff
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_safety_wheel_extended
    type: bool
    restore_value: false
    initial_value: 'false'

  # --- Publications MQTT différées (voir gen3.yaml) ---
  - id: g_pub_wheels_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pub_wheels_payload
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: g_pub_safety_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pub_safety_payload
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: g_pub_scan_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_pub_scan_payload
    type: std::string
    restore_value: false
    initial_value: '""'

  # --- Calibration (réglable à chaud via MQTT, persistée en flash) ---
  - id: g_cal_drop_threshold_mm
    type: float
    restore_value: true
    initial_value: '${drop_threshold_mm_default}'
  - id: g_cal_dist_scale
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: g_cal_wheel_base_m
    type: float
    restore_value: true
    initial_value: '${wheel_base_m_default}'

  # --- Commande en attente (injection one-shot) ---
  - id: g_pending_cmd
    type: std::string
    restore_value: false
    initial_value: '""'

# ---- Réception cmd_vel (Nav2, via slam_bridge.py) ----
text_sensor:
  - platform: mqtt_subscribe
    id: cmd_vel_in
    topic: ${mqtt_cmd_vel_topic}
    on_value:
      then:
        - lambda: |-
            json::parse_json(x, [](JsonObject root) -> bool {
              if (!root["linear_x"].is<float>() || !root["angular_z"].is<float>())
                return false;
              id(g_cmd_linear_x) = root["linear_x"].as<float>();
              id(g_cmd_angular_z) = root["angular_z"].as<float>();
              id(g_cmd_last_ms) = millis();
              return true;
            });

  # ---- Commandes brosse/aspirateur + test + calibration ----
  # Payloads attendus (texte brut) :
  #   "clean_on" / "clean_off"
  #   "pause_polling" / "resume_polling"
  #   "raw:<commande>" -> envoie <commande> une seule fois
  #   "cal:drop_threshold:<mm>" / "cal:dist_scale:<f>" / "cal:wheel_base:<m>"
  - platform: mqtt_subscribe
    id: clean_cmd_in
    topic: ${mqtt_clean_cmd_topic}
    on_value:
      then:
        - lambda: |-
            if (x == "clean_on") {
              id(g_pending_cmd) = "Clean CleaningEnable \n";
            } else if (x == "clean_off") {
              id(g_pending_cmd) = "Clean CleaningDisable \n";
            } else if (x == "pause_polling") {
              id(g_slam_poll_paused) = true;
              ESP_LOGW("test", "Round-robin en pause (mode test manuel)");
            } else if (x == "resume_polling") {
              id(g_slam_poll_paused) = false;
              ESP_LOGW("test", "Round-robin repris");
            } else if (x.rfind("raw:", 0) == 0) {
              std::string cmd = x.substr(4) + " \n";
              id(g_pending_cmd) = cmd;
              ESP_LOGW("test", "Commande de test en attente: %s", x.substr(4).c_str());
            } else if (x.rfind("cal:drop_threshold:", 0) == 0) {
              float v = atof(x.substr(20).c_str());
              id(g_cal_drop_threshold_mm) = v;
              ESP_LOGW("cal", "g_cal_drop_threshold_mm = %.1f mm", v);
            } else if (x.rfind("cal:dist_scale:", 0) == 0) {
              float v = atof(x.substr(16).c_str());
              id(g_cal_dist_scale) = v;
              ESP_LOGW("cal", "g_cal_dist_scale = %.4f", v);
            } else if (x.rfind("cal:wheel_base:", 0) == 0) {
              float v = atof(x.substr(16).c_str());
              id(g_cal_wheel_base_m) = v;
              ESP_LOGW("cal", "g_cal_wheel_base_m = %.4f m", v);
            }

script:
  - id: slam_poll_cycle
    mode: single
    then:
      - lambda: |-
          // Séquence minimale : uniquement les ajouts SLAM. GetErr/
          // GetState/GetCharger restent gérés par le bloc "interval:"
          // de l'original (gen3.yaml, non modifié) - pas dupliqués ici.
          // 0=GetDigitalSensors, 1=GetAnalogSensors, 2=SetMotor,
          // 3=GetMotor, 4=GetLDSScan
          // Séquence retravaillée pour prioriser l'odométrie (GetMotor,
          // action 3) : avec l'ancienne séquence (1 seul pas sur 9),
          // GetMotor ne revenait que toutes les ~50s en pratique, dominé
          // par le temps de réponse propre de GetLDSScan (~3.6s côté
          // robot, incompressible - pas un goulot d'étranglement ESP32).
          // Confirmé sur robot réel : /odom quasi figé, carte slam_toolbox
          // qui progresse à peine malgré un robot qui bouge réellement.
          // GetMotor revient maintenant 4 fois sur 8 (chaque réponse est
          // rapide, pas de gros volume à transmettre) ; GetLDSScan garde
          // 1 seul passage par cycle (son propre temps de réponse reste
          // le facteur limitant du cycle complet, mais l'odométrie n'a
          // plus à l'attendre pour progresser). GetDigitalSensors/
          // GetAnalogSensors gardent 1 passage chacun (plus besoin de 2
          // pas sur 3 comme avant : plus d'arrêt automatique piloté par
          // ces lectures, retiré à la demande - juste des flags exposés
          // en MQTT désormais).
          // 0=GetDigitalSensors, 1=GetAnalogSensors, 2=SetMotor,
          // 3=GetMotor, 4=GetLDSScan
          // GetLDSScan doublé (2 passages sur 10 au lieu de 1 sur 8) :
          // avec la cadence précédente, deux scans consécutifs pouvaient
          // être séparés de plusieurs mètres de déplacement réel,
          // laissant trop peu de recouvrement au LiDAR pour que
          // slam_toolbox recolle les scans entre eux - confirmé sur
          // robot réel : carte fragmentée en petits îlots déconnectés
          // au lieu d'une zone continue, malgré une odométrie qui
          // progresse normalement. GetMotor reste majoritaire (5/10)
          // pour une odométrie fluide entre deux scans.
          // GetLDSScan très majoritaire (7 passages sur 15) : même en
          // doublant sa fréquence précédente (1 sur 8 -> 2 sur 10), le
          // recouvrement entre scans consécutifs restait insuffisant à
          // vitesse réelle de nettoyage - confirmé sur robot réel, carte
          // toujours fragmentée en îlots déconnectés malgré une
          // odométrie qui progresse correctement. GetMotor reste présent
          // (6/15) pour garder une odométrie utilisable entre deux
          // scans, mais GetDigitalSensors/GetAnalogSensors/SetMotor
          // deviennent très occasionnels (1/15 chacun) - plus aucune
          // sécurité automatique n'en dépend actuellement, juste des
          // flags exposés en MQTT à titre informatif.
          // ATTENTION : GetLDSScan reste intrinsèquement lent (~3.6s de
          // réponse côté robot, incompressible) - c'est le vrai plancher
          // de fréquence possible avec cette architecture de polling sur
          // un seul fil UART partagé. Si ça ne suffit toujours pas, la
          // vraie solution serait de ralentir la vitesse de déplacement
          // du robot pendant la cartographie, pas de pousser davantage
          // ce round-robin.
          static const int SEQ[15] = {
            4, 3, 4, 3, 4, 0, 4, 3, 4, 3, 4, 1, 4, 3, 2
          };

          if (id(g_slam_poll_paused)) {
            if (!id(g_pending_cmd).empty()) {
              id(g_awaiting_response) = true;
              id(g_awaiting_response_since_ms) = millis();
              id(uart_bus).write_str(id(g_pending_cmd).c_str());
              id(g_pending_cmd) = "";
            }
            return;
          }

          if (id(g_awaiting_response)) {
            uint32_t waited = millis() - id(g_awaiting_response_since_ms);
            if (waited < 6000) {
              return;
            }
            ESP_LOGW("uart_parser", "Timeout en attente de reponse UART (%u ms), on force la reprise", (unsigned int) waited);
            id(g_awaiting_response) = false;
          }

          int step = id(g_slam_poll_step);
          id(g_slam_poll_step) = (step + 1) % 15;
          int action = SEQ[step];

          if (!id(g_pending_cmd).empty() && action != 0 && action != 1) {
            id(g_awaiting_response) = true;
            id(g_awaiting_response_since_ms) = millis();
            id(uart_bus).write_str(id(g_pending_cmd).c_str());
            id(g_pending_cmd) = "";
            return;
          }

          if (action == 0) {
            id(g_awaiting_response) = true;
            id(g_awaiting_response_since_ms) = millis();
            id(uart_bus).write_str("GetDigitalSensors \n");
            return;
          }
          if (action == 1) {
            id(g_awaiting_response) = true;
            id(g_awaiting_response_since_ms) = millis();
            id(uart_bus).write_str("GetAnalogSensors \n");
            return;
          }
          if (action == 4) {
            id(g_awaiting_response) = true;
            id(g_awaiting_response_since_ms) = millis();
            id(uart_bus).write_str("GetLDSScan \n");
            return;
          }
          if (action == 3) {
            id(g_awaiting_response) = true;
            id(g_awaiting_response_since_ms) = millis();
            id(uart_bus).write_str("GetMotor \n");
            return;
          }

          // action == 2 : SetMotor, traduit depuis le dernier cmd_vel reçu.
          // AUCUNE écriture ici si cmd_vel est périmé (contrairement à la
          // version précédente qui envoyait "LWheelDisable RWheelDisable"
          // par défaut) - on saute simplement ce pas. SetMotor nécessite
          // TestMode, qu'on ne réaffirme plus automatiquement : envoyer un
          // Disable par défaut ici échouerait de toute façon la plupart du
          // temps, autant ne rien envoyer.
          uint32_t now = millis();
          bool stale = (id(g_cmd_last_ms) == 0) ||
                       (now - id(g_cmd_last_ms) > ${cmd_vel_stale_timeout});
          if (stale) {
            return;
          }

          float v = id(g_cmd_linear_x);
          float w = id(g_cmd_angular_z);

          float wheel_base = id(g_cal_wheel_base_m);
          float v_left = v - (w * wheel_base / 2.0f);
          float v_right = v + (w * wheel_base / 2.0f);

          float lookahead = ${setmotor_lookahead_s};
          long dist_left_mm = (long) (v_left * lookahead * 1000.0f * id(g_cal_dist_scale));
          long dist_right_mm = (long) (v_right * lookahead * 1000.0f * id(g_cal_dist_scale));

          float speed_mm_s = std::max(std::fabs(v_left), std::fabs(v_right)) * 1000.0f;
          if (speed_mm_s > ${setmotor_max_speed}) speed_mm_s = ${setmotor_max_speed};
          if (speed_mm_s < 1.0f) speed_mm_s = 1.0f;

          char cmd[96];
          int len = snprintf(cmd, sizeof(cmd),
                              "SetMotor RWheelDist %ld LWheelDist %ld Speed %d \n",
                              dist_right_mm, dist_left_mm, (int) speed_mm_s);
          if (len > 0 && len < (int) sizeof(cmd)) {
            id(g_awaiting_response) = true;
            id(g_awaiting_response_since_ms) = millis();
            id(uart_bus).write_str(cmd);
          }

interval:
  - interval: ${slam_poll_interval}
    then:
      - script.execute: slam_poll_cycle

  # Vidage des publications MQTT différées, indépendant du round-robin.
  - interval: 50ms
    then:
      - lambda: !lambda |-
          if (id(g_pub_wheels_pending)) {
            id(g_pub_wheels_pending) = false;
            id(neato_mqtt).publish("${mqtt_wheels_topic}", id(g_pub_wheels_payload), 0, false);
          }
          if (id(g_pub_safety_pending)) {
            id(g_pub_safety_pending) = false;
            id(neato_mqtt).publish("${mqtt_safety_topic}", id(g_pub_safety_payload), 1, false);
          }
          if (id(g_pub_scan_pending)) {
            id(g_pub_scan_pending) = false;
            id(neato_mqtt).publish("${mqtt_scan_topic}", id(g_pub_scan_payload), 0, false);
          }
