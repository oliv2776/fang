# Config slam_toolbox pour Neato D7 gen3 avec LiDAR 360°
# Scan produit par GetLDSScan (parsing texte sur le port debug) :
# 360 points (1 par degré), range 0.1m-8m.
#
# BUGFIX (historique) : ce fichier avait été accidentellement écrasé par
# une copie de slam_server.py (plus de YAML valide du tout, le parsing
# plantait au lancement de slam_toolbox). Contenu restauré depuis
# l'historique git (commit précédent 760b368).

slam_toolbox:
  ros__parameters:
     # --- Plugin ---
    plugin_name: "slam_toolbox::LocalLocalizationSync"

     # --- Lifecycle ---
     # Important : sans ça, le nœud reste en état "unconfigured"
     # et ne publie jamais /map
    use_lifecycle: false

     # --- Frames ---
    odom_frame: odom
    map_frame: map
    base_frame: base_link

     # --- Scan matching (LiDAR 360°) ---
    map_update_interval: 5.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    # 1.5m (valeur d'origine) était trop strict pour la cadence réelle du
    # round-robin ESP32 (polling sur un seul fil UART partagé, GetLDSScan
    # ~3.6-4s de réponse incompressible côté robot) - le robot parcourt
    # souvent plus de 1.5m entre deux scans à vitesse de nettoyage
    # normale, confirmé sur robot réel (carte fragmentée en îlots
    # déconnectés malgré une odométrie qui progresse correctement et une
    # fréquence de scan déjà maximisée côté round-robin). 5.0m laisse
    # nettement plus de marge pour relier des scans espacés, au prix
    # d'un risque de mauvais appariement un peu plus élevé si deux zones
    # différentes se ressemblent visuellement - à resserrer plus tard si
    # la carte devient rectangulairement dupliquée par endroits.
    link_scan_maximum_distance: 5.0

     # --- Localisation ---
    localization: false
    map_output_interval: 30.0

     # --- TF ---
    tf_buffer_duration: 30.0
    transform_publish_period: 0.05

     # --- Queue ---
    map_queue_size: 5
    pose_queue_size: 10
    scan_queue_size: 10

     # --- Filtre ---
    filter_size: 1000
    filter_size_max: 5000

     # --- Debug ---
    debug_file: ""
